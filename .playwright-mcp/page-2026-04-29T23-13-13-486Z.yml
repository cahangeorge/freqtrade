          - heading "Introduction ¶" [level=2] [ref=e397]:
            - text: Introduction
            - link "¶" [ref=e398] [cursor=pointer]:
              - /url: "#introduction"
          - paragraph [ref=e399]: Freqtrade is a free and open source crypto trading bot written in Python. It is designed to support all major exchanges and be controlled via Telegram or webUI. It contains backtesting, plotting and money management tools as well as strategy optimization by machine learning.
          - generic [ref=e400]:
            - paragraph [ref=e401]: DISCLAIMER
            - paragraph [ref=e402]: This software is for educational purposes only. Do not risk money which you are afraid to lose. USE THE SOFTWARE AT YOUR OWN RISK. THE AUTHORS AND ALL AFFILIATES ASSUME NO RESPONSIBILITY FOR YOUR TRADING RESULTS.
            - paragraph [ref=e403]: Always start by running a trading bot in Dry-run and do not engage money before you understand how it works and what profit/loss you should expect.
            - paragraph [ref=e404]: We strongly recommend you to have basic coding skills and Python knowledge. Do not hesitate to read the source code and understand the mechanisms of this bot, algorithms and techniques implemented in it.
          - paragraph [ref=e405]:
            - img "freqtrade screenshot" [ref=e406]
          - heading "Features ¶" [level=2] [ref=e407]:
            - text: Features
            - link "¶" [ref=e408] [cursor=pointer]:
              - /url: "#features"
          - list [ref=e409]:
            - listitem [ref=e410]:
              - text: "Develop your Strategy: Write your strategy in python, using"
              - link "pandas" [ref=e411] [cursor=pointer]:
                - /url: https://pandas.pydata.org/
              - text: . Example strategies to inspire you are available in the
              - link "strategy repository" [ref=e412] [cursor=pointer]:
                - /url: https://github.com/freqtrade/freqtrade-strategies
              - text: .
            - listitem [ref=e413]: "Download market data: Download historical data of the exchange and the markets your may want to trade with."
            - listitem [ref=e414]: "Backtest: Test your strategy on downloaded historical data."
            - listitem [ref=e415]: "Optimize: Find the best parameters for your strategy using hyperoptimization which employs machine learning methods. You can optimize buy, sell, take profit (ROI), stop-loss and trailing stop-loss parameters for your strategy."
            - listitem [ref=e416]: "Select markets: Create your static list or use an automatic one based on top traded volumes and/or prices (not available during backtesting). You can also explicitly blacklist markets you don't want to trade."
            - listitem [ref=e417]: "Run: Test your strategy with simulated money (Dry-Run mode) or deploy it with real money (Live-Trade mode)."
            - listitem [ref=e418]: "Control/Monitor: Use Telegram or a WebUI (start/stop the bot, show profit/loss, daily summary, current open trades results, etc.)."
            - listitem [ref=e419]:
              - text: "Analyze: Further analysis can be performed on either Backtesting data or Freqtrade trading history (SQL database), including automated standard plots, and methods to load the data into"
              - link "interactive environments" [ref=e420] [cursor=pointer]:
                - /url: data-analysis/
              - text: .
