          - paragraph [ref=e445]: This page explains how to prepare your environment for running the bot.
          - paragraph [ref=e446]: The freqtrade documentation describes various ways to install freqtrade
          - list [ref=e447]:
            - listitem [ref=e448]:
              - link "Docker images" [ref=e449] [cursor=pointer]:
