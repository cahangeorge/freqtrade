            - link "¶" [ref=e576] [cursor=pointer]:
              - /url: "#other-options-of-setupsh-script"
          - paragraph [ref=e577]:
            - text: You can also update, configure and reset the codebase of your bot with
            - code [ref=e578]: ./setup.sh
          - generic [ref=e580]:
            - navigation [ref=e581]:
              - button "Copy to clipboard" [ref=e582] [cursor=pointer]
            - code [ref=e583]: "# --update, Command git pull to update. ./setup.sh -u # --reset, Hard reset your develop/stable branch. ./setup.sh -r"
          - generic [ref=e585]:
            - navigation [ref=e586]:
              - button "Copy to clipboard" [ref=e587] [cursor=pointer]
            - code [ref=e588]: "** --install ** With this option, the script will install the bot and most dependencies: You will need to have git and python3.11+ installed beforehand for this to work. * Mandatory software as: `ta-lib` * Setup your virtualenv under `.venv/` This option is a combination of installation tasks and `--reset` ** --update ** This option will pull the last version of your current branch and update your virtualenv. Run the script with this option periodically to update your bot. ** --reset ** This option will hard reset your branch (only if you are on either `stable` or `develop`) and recreate your virtualenv."
          - heading "Activate your virtual environment ¶" [level=4] [ref=e589]:
            - text: Activate your virtual environment
