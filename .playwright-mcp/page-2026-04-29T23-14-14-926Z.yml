              - link "Installation with Conda" [ref=e455] [cursor=pointer]:
                - /url: "#installation-with-conda"
          - paragraph [ref=e456]:
            - text: Please consider using the prebuilt
            - link "docker images" [ref=e457] [cursor=pointer]:
              - /url: ../docker_quickstart/
            - text: to get started quickly.
          - generic [ref=e458]:
            - paragraph [ref=e459]: Updating
            - paragraph [ref=e460]:
              - text: Keeping freqtrade updated is important to
              - link "ensure ongoing compatibility" [ref=e461] [cursor=pointer]:
                - /url: ../updating/#why-update
              - text: with exchange API's. Please refer to the
              - link "updating guide" [ref=e462] [cursor=pointer]:
                - /url: ../updating/
              - text: for details on how to update your installation.
          - generic [ref=e463]:
            - paragraph [ref=e464]: Windows users
            - paragraph [ref=e465]:
              - text: We
              - strong [ref=e466]: strongly
              - text: recommend that Windows users use
              - link "Docker" [ref=e467] [cursor=pointer]:
                - /url: ../docker_quickstart/
              - text: as this will work much easier and smoother (also more secure).
            - paragraph [ref=e468]:
              - text: If that is not possible, try using the Windows Linux subsystem (WSL) - for which the Ubuntu/Linux instructions will work. If you really want to install freqtrade natively on Windows, best use the
              - link "./setup.ps1 installation script" [ref=e469] [cursor=pointer]:
                - /url: "#use-setupps1-windows"
                - code [ref=e470]: ./setup.ps1
                - text: installation script
              - text: .
            - paragraph [ref=e471]: Please also make sure to use the 64bit version of Python, as 32bit versions have severe memory limitations, which can negatively impact your experience with backtesting/hyperopt.
          - separator [ref=e472]
          - heading "Information ¶" [level=2] [ref=e473]:
            - text: Information
            - link "¶" [ref=e474] [cursor=pointer]:
              - /url: "#information"
          - paragraph [ref=e475]:
            - text: The easiest way to install and run Freqtrade is to clone the bot Github repository and then run the
            - code [ref=e476]: ./setup.sh
            - text: (
            - code [ref=e477]: ./setup.ps1
            - text: for Windows) script, if it's available for your platform.
          - generic [ref=e478]:
            - paragraph [ref=e479]: Version considerations
            - paragraph [ref=e480]:
              - text: When cloning the repository the default working branch has the name
              - code [ref=e481]: develop
              - text: . This branch contains all last features (can be considered as relatively stable, thanks to automated tests). The
              - code [ref=e482]: stable
              - text: branch contains the code of the last release (done usually once per month on an approximately one week old snapshot of the
              - code [ref=e483]: develop
              - text: branch to prevent packaging bugs, so potentially it's more stable).
          - generic [ref=e484]:
            - paragraph [ref=e485]: Note
            - paragraph [ref=e486]:
              - text: Either
              - link "uv" [ref=e487] [cursor=pointer]:
                - /url: https://docs.astral.sh/uv/
              - text: ", or Python3.11 or higher and the corresponding"
              - code [ref=e488]: pip
              - text: are assumed to be available. The install-script will warn you and stop if that's not the case.
              - code [ref=e489]: git
              - text: is also needed to clone the Freqtrade repository.
              - text: Also, python headers (
              - code [ref=e490]: python<yourversion>-dev
              - text: /
              - code [ref=e491]: python<yourversion>-devel
              - text: ) must be available for the installation to complete successfully.
          - generic [ref=e492]:
            - paragraph [ref=e493]: Up-to-date clock
            - paragraph [ref=e494]: The clock on the system running the bot must be accurate, synchronized to a NTP server frequently enough to avoid problems with communication to the exchanges.
          - separator [ref=e495]
