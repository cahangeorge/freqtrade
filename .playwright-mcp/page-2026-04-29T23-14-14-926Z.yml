            - link "¶" [ref=e568] [cursor=pointer]:
              - /url: "#use-setupsh-install-linuxmacos"
          - paragraph [ref=e569]: If you are on Debian, Ubuntu or MacOS, freqtrade provides the script to install freqtrade.
          - generic [ref=e571]:
            - navigation [ref=e572]:
              - button "Copy to clipboard" [ref=e573] [cursor=pointer]
            - code [ref=e574]: "# --install, Install freqtrade from scratch ./setup.sh -i"
